# Example snippet for joint cosmic shear 2pt + map3 in this fork.
# This version uses files staged under ./workspace/ as requested.

likelihood:
  roman_real.cosmic_shear_2pt_map3:
    path: ./external_modules/data/roman_real
    data_file: example1.dataset
    lmax: 70000
    accuracyboost: 1.0
    integration_accuracy: 0
    kmax_boltzmann: 7.5
    non_linear_emul: 2
    IA_model: 0
    IA_redshift_evolution: 3
    ggl_exclude: [[6,0],[7,0],[7,1]]

    # Simulation-based joint covariance/data placeholders (xi followed by map3).
    joint_data_vector_file: ./workspace/reference_configs/joint_xi_map3_data.txt
    joint_cov_file: ./workspace/reference_configs/joint_xi_map3_cov.txt
    joint_mask_file: ./workspace/reference_configs/joint_xi_map3_mask.txt

theory:
  map3_provider:
    python_path: ./workspace/python
    map3_file: ./workspace/reference_configs/joint_map3_theory_template.txt
